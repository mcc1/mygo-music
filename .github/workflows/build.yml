name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, platform: linux/amd64, artifact: linux-x64 }
          - { name: Windows x64, platform: windows/amd64, artifact: windows-x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Find Go caches
        id: go-env
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-env.outputs.build }}
            ${{ steps.go-env.outputs.mod }}
          key: go-${{ matrix.artifact }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-${{ matrix.artifact }}-
      - name: Install NSIS
        if: github.ref_type == 'tag' && matrix.platform == 'windows/amd64'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          args=()
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            args+=(-skip-installer)
          fi
          go tool mygo build -platform "$PLATFORM" "${args[@]}" -o build/ci
      - uses: actions/upload-artifact@v7
        with:
          name: mygo-music-${{ matrix.artifact }}
          path: build/ci/
          if-no-files-found: error
          include-hidden-files: true

  release:
    name: Draft release
    if: github.ref_type == 'tag' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v8
        with:
          pattern: mygo-music-*-x64
          path: build/release-input
      - name: Prepare verified release assets
        run: |
          slug=$(bun -e 'import config from "./mygo.config.ts"; console.log(config.slug)')
          version=$(bun -e 'import config from "./mygo.config.ts"; console.log(config.version)')
          bash scripts/prepare-release.sh "$slug" "$version" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
      - name: Attach assets to a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if state=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            if [[ "$state" != true ]]; then
              echo "::error::Release $tag is already published"
              exit 1
            fi
          else
            bash scripts/release-notes.sh "$GITHUB_REPOSITORY" "$tag" > build/release-notes.md
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$tag" --notes-file build/release-notes.md
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber build/release-assets/*
